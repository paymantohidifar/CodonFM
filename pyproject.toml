[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "CodonFM"
version = "0.1.0"
description = "CodonFM."
readme = "README.md"
requires-python = ">= 3.11"

dependencies = [
    # --- numerics (also declared as conda in [tool.pixi.dependencies]) ---
    "numpy==2.2.3",
    "pandas==2.2.3",
    "matplotlib==3.10.0",
    "scipy==1.14.1",
    # --- plotting / progress ---
    "seaborn==0.13.2",
    "tqdm==4.67.1",
    # --------- pytorch (cu124 index via [tool.uv.sources] / pixi index=) ---------
    "torch==2.5.1",
    "xformers==0.0.28.post3",
    "lightning==2.5.2",
    # --------- ml / model ---------
    "transformers==4.54.1",
    "scikit-learn==1.5.2",
    "peft==0.15.2",
    "einops==0.8.0",
    "fiddle==0.3.0",
    # --------- huggingface tooling ---------
    "huggingface-hub[cli]>=0.36.2,<0.37",
    "hf-transfer>=0.1.9,<0.2",
    # --------- data ---------
    "polars==1.12.0",
    "pyarrow==24.0.0",
    "biopython==1.85",
    "pyfaidx==0.8.1.4",
    # --------- runtime utils ---------
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "wandb==0.21.0",
    "pre-commit==4.0.1",
    # The following were pinned upstream but are imported nowhere in the repo
    # (no src/, tests/, notebooks/, or data_scripts/ reference). Kept here,
    # commented, for future reference.
    # "torchvision==0.20.1",   # route via pytorch-cu124 index if re-enabled
    # "hydra-core==1.3.2",
    # "hydra-colorlog==1.2.0",
    # "hydra-optuna-sweeper==1.2.0",
    # "rootutils==1.0.7",
    # "rich==13.9.4",
    # "sh==2.2.2",
    # "ninja==1.11.1.1",
    # "lru-dict==1.3.0",
    # "ipython-autotime==0.3.2",
    # "datasets==4.0.0",
    # "scanpy==1.11.3",
]
test = ["pytest==8.1.1"]

# Local packages to include in the wheel distribution
[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- UV Engine Hardware Resolution Mapping ---
# `explicit = true` means ONLY packages listed in [tool.uv.sources] are pulled
# from this index; everything else still resolves from PyPI. Both torch AND
# xformers must be mapped, or uv installs the CPU torch wheel from PyPI.
[tool.uv]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124" }]
xformers = [{ index = "pytorch-cu124" }]

# --- Ruff configuration ---
[tool.ruff]
line-length = 110
target-version = "py311"

# --- Pixi Configuration Hook (Read ONLY by local Pixi installations) ---
[tool.pixi.workspace]
channels = ["conda-forge"]
name = "CodonFM"
version = "0.1.0"
platforms = ["linux-64"]

[tool.pixi.system-requirements]
cuda = "12"

# Conda (base / default env).
[tool.pixi.dependencies]
python = "3.11.*"
numpy = "==2.2.3"
pandas = "==2.2.3"
matplotlib = "==3.10.0"
scipy = "==1.14.1"
pixi-kernel = "*"
jupyterlab = ">=4.5.8,<5"
ipykernel = ">=7.3.0,<8"
ffmpeg = ">=8.1.2,<9"
libsndfile = ">=1.2.2,<2"

# PyPI (base / default env).
[tool.pixi.pypi-dependencies]
codonfm = { path = ".", editable = true }
torch = { version = "==2.5.1", index = "https://download.pytorch.org/whl/cu124" }
xformers = { version = "==0.0.28.post3", index = "https://download.pytorch.org/whl/cu124" }

# dev / finetuning feature: training-only extras. Do NOT re-declare torch here
# — the dev env shares solve-group "default" and inherits it from above.
[tool.pixi.feature.dev.pypi-dependencies]
wandb = "==0.21.0"
pre-commit = "==4.0.1"
# The following were pinned upstream but are imported nowhere in the repo
# (no src/, tests/, notebooks/, or data_scripts/ reference). Kept here,
# commented, for future reference. Uncomment + `pixi install` if needed.
# torchvision = { version = "==0.20.1", index = "https://download.pytorch.org/whl/cu124" }
# hydra-core = "==1.3.2"
# hydra-colorlog = "==1.2.0"
# hydra-optuna-sweeper = "==1.2.0"
# rootutils = "==1.0.7"
# rich = "==13.9.4"
# sh = "==2.2.2"
# ninja = "==1.11.1.1"
# lru-dict = "==1.3.0"
# ipython-autotime = "==0.3.2"
# datasets = "==4.0.0"
# scanpy = "==1.11.3"

# test feature
[tool.pixi.feature.test.pypi-dependencies]
pytest = "==8.1.1"

[tool.pixi.feature.test.tasks]
test = "pytest tests/"

[tool.pixi.tasks]
hf-download = "hf download"
hf-login = "hf login"
lint = "ruff check ."

# All three share solve-group "default" so torch/lightning/etc. resolve to
# identical versions across envs (one consistent lock).
[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev", "test"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
