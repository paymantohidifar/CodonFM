[workspace]
channels = ["conda-forge"]
name = "CodonFM"
platforms = [ { platform = "linux-64", cuda = "12" } ]
version = "0.1.0"

[tasks]
test = "pytest tests/"
hf-download = "hf download"
hf-login = "hf login"

[dependencies]
python = "3.11.*"
numpy = "==2.2.3"
pandas = "==2.2.3"
matplotlib = "==3.10.0"
scipy = "==1.14.1"
pixi-kernel = "*"
jupyterlab = ">=4.5.8,<5"
ipykernel = ">=7.3.0,<8"
ffmpeg = ">=8.1.2,<9"
libsndfile = ">=1.2.2,<2"

[pypi-dependencies]
torch = { version = "==2.5.1", index = "https://download.pytorch.org/whl/cu124" }
torchvision = { version = "==0.20.1", index = "https://download.pytorch.org/whl/cu124" }
xformers = { version = "==0.0.28.post3", index = "https://download.pytorch.org/whl/cu124" }
seaborn = "==0.13.2"
tqdm = "==4.67.1"
transformers = "==4.54.1"
scikit-learn = "==1.5.2"
huggingface-hub = { version = ">=0.36.2, <0.37", extras = ["cli"] }
hf-transfer = ">=0.1.9, <0.2"

[feature.dev.pypi-dependencies]
lightning = "==2.5.2"
hydra-core = "==1.3.2"
hydra-colorlog = "==1.2.0"
hydra-optuna-sweeper = "==1.2.0"
wandb = "==0.21.0"
rootutils = "==1.0.7"
pre-commit = "==4.0.1"
rich = "==13.9.4"
pytest = "==8.1.1"
sh = "==2.2.2"
polars = "==1.12.0"
ninja = "==1.11.1.1"
einops = "==0.8.0"
ipython-autotime = "==0.3.2"
lru-dict = "==1.3.0"
datasets = "==4.0.0"
scanpy = "==1.11.3"
pyfaidx = "==0.8.1.4"
biopython = "==1.85"
peft = "==0.15.2"
fiddle = "==0.3.0"

[environments]
default = { features = ["dev"], no-default-feature = false }
