[workspace]
channels = ["conda-forge"]
authors = ["Payman Tohidifar <payman.tohidifar@gmail.com>"]
name = "CodonFM"
platforms = [{ platform = "linux-64", cuda = "12" }]
version = "0.1.0"

[tasks]
hf-download = "hf download"
hf-login = "hf login"

# --- Base / default environment (conda deps) ---
# Serves inference/eval AND notebooks (notebooks 0-6 are the primary eval surface).
[dependencies]
python = "3.11.*"
numpy = "==2.2.3"
pandas = "==2.2.3"
matplotlib = "==3.10.0"
scipy = "==1.14.1"
pixi-kernel = "*"
jupyterlab = ">=4.5.8,<5"
ipykernel = ">=7.3.0,<8"
ffmpeg = ">=8.1.2,<9"
libsndfile = ">=1.2.2,<2"

# --- Base / default environment (PyPI deps) ---
# Includes everything imported unconditionally on the inference/eval path
# (lightning, peft, fiddle, einops, polars) plus notebook-00 deps (biopython, pyfaidx).
[pypi-dependencies]
torch = { version = "==2.5.1", index = "https://download.pytorch.org/whl/cu124" }
xformers = { version = "==0.0.28.post3", index = "https://download.pytorch.org/whl/cu124" }
seaborn = "==0.13.2"
tqdm = "==4.67.1"
transformers = "==4.54.1"
scikit-learn = "==1.5.2"
huggingface-hub = { version = ">=0.36.2, <0.37", extras = ["cli"] }
hf-transfer = ">=0.1.9, <0.2"
lightning = "==2.5.2"
peft = "==0.15.2"
fiddle = "==0.3.0"
einops = "==0.8.0"
polars = "==1.12.0"
pyarrow = "==24.0.0"
python-dotenv = "==1.2.2"
biopython = "==1.85"
pyfaidx = "==0.8.1.4"

# --- dev / finetuning feature: training-only extras ---
[feature.dev.pypi-dependencies]
wandb = "==0.21.0"
pre-commit = "==4.0.1"
# The following were pinned upstream but are imported nowhere in the repo
# (no src/, tests/, notebooks/, or data_scripts/ reference). Kept here,
# commented, for future reference. Uncomment + `pixi install` if needed.
# torchvision = { version = "==0.20.1", index = "https://download.pytorch.org/whl/cu124" }
# hydra-core = "==1.3.2"
# hydra-colorlog = "==1.2.0"
# hydra-optuna-sweeper = "==1.2.0"
# rootutils = "==1.0.7"
# rich = "==13.9.4"
# sh = "==2.2.2"
# ninja = "==1.11.1.1"
# lru-dict = "==1.3.0"
# ipython-autotime = "==0.3.2"
# datasets = "==4.0.0"
# scanpy = "==1.11.3"

# --- test feature ---
[feature.test.pypi-dependencies]
pytest = "==8.1.1"

[feature.test.tasks]
test = "pytest tests/"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev", "test"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
